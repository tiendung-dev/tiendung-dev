<svg width="850" height="280" viewBox="0 0 850 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="850" height="280" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Header -->
  <g transform="translate(30, 30)">
    <text x="0" y="10" fill="#00F0FF" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="18" font-weight="700">
      ⚡ Nguyen Tien Dung (tiendung-dev) — GitHub Engineering Metrics
    </text>
    <text x="0" y="32" fill="#64748B" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="12">
      Auto-generated metrics stream via lowlighter/metrics • Updated dynamically
    </text>
  </g>

  <!-- Left Column: Core Stats -->
  <g transform="translate(30, 90)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="360" height="40" rx="6" fill="#131B2E" />
    <text x="16" y="25" fill="#94A3B8" font-family="monospace" font-size="13">📁 Public Repositories</text>
    <text x="320" y="25" fill="#00F0FF" font-family="monospace" font-size="14" font-weight="bold">8+</text>

    <!-- Box 2 -->
    <rect x="0" y="50" width="360" height="40" rx="6" fill="#131B2E" />
    <text x="16" y="75" fill="#94A3B8" font-family="monospace" font-size="13">💻 Primary Language</text>
    <text x="260" y="75" fill="#F7DF1E" font-family="monospace" font-size="14" font-weight="bold">JavaScript</text>

    <!-- Box 3 -->
    <rect x="0" y="100" width="360" height="40" rx="6" fill="#131B2E" />
    <text x="16" y="125" fill="#94A3B8" font-family="monospace" font-size="13">⚙️ Core Framework</text>
    <text x="285" y="125" fill="#38B2AC" font-family="monospace" font-size="14" font-weight="bold">Node.js</text>
  </g>

  <!-- Right Column: Language Distribution -->
  <g transform="translate(430, 90)">
    <text x="0" y="10" fill="#E2E8F0" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="14" font-weight="600">
      Top Languages &amp; Stacks
    </text>

    <!-- Progress Bar Stack -->
    <rect x="0" y="25" width="380" height="12" rx="6" fill="#1E293B"/>
    <rect x="0" y="25" width="220" height="12" rx="6" fill="#F7DF1E"/>
    <rect x="220" y="25" width="90" height="12" fill="#3776AB"/>
    <rect x="310" y="25" width="50" height="12" fill="#E34F26"/>
    <rect x="360" y="25" width="20" height="12" rx="6" fill="#1572B6"/>

    <!-- Legend -->
    <g transform="translate(0, 55)">
      <circle cx="6" cy="6" r="5" fill="#F7DF1E"/>
      <text x="18" y="10" fill="#CBD5E1" font-family="monospace" font-size="12">JavaScript (58%)</text>

      <circle cx="160" cy="6" r="5" fill="#3776AB"/>
      <text x="172" y="10" fill="#CBD5E1" font-family="monospace" font-size="12">Python (24%)</text>
    </g>
    <g transform="translate(0, 80)">
      <circle cx="6" cy="6" r="5" fill="#E34F26"/>
      <text x="18" y="10" fill="#CBD5E1" font-family="monospace" font-size="12">HTML / CSS (13%)</text>

      <circle cx="160" cy="6" r="5" fill="#ED8B00"/>
      <text x="172" y="10" fill="#CBD5E1" font-family="monospace" font-size="12">Java (5%)</text>
    </g>

    <!-- Status indicator -->
    <text x="0" y="135" fill="#00F0FF" font-family="monospace" font-size="11">
      ● Realtime sync configured via .github/workflows/metrics.yml
    </text>
  </g>

  <!-- Border accent -->
  <line x1="0" y1="279" x2="850" y2="279" stroke="url(#cyanGrad)" stroke-width="2"/>
</svg>
