name: GitHub Metrics

on:
  schedule:
    # Runs everyday at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Main GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: tiendung-dev
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          output_action: commit
          committer_message: "chore: update github metrics [skip ci]"
          filename: github-metrics.svg
          plugin_lines: yes
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact

      - name: Generate Secondary ISO Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: tiendung-dev
          template: classic
          base: ""
          output_action: commit
          committer_message: "chore: update isocalendar metrics [skip ci]"
          filename: metrics.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
