name: Generate Contribution Snake

on:
  schedule:
    # Runs every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=#00F0FF&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit and Push Snake SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          if git diff --staged --quiet; then
            echo "No changes in snake animation."
          else
            git commit -m "chore: update contribution snake animation [skip ci]"
            git push
          fi
