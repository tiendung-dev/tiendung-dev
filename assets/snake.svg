<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="850" height="150" rx="10" fill="#0B0F19"/>
  <defs>
    <linearGradient id="cyberSnake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Contribution Grid Header -->
  <text x="30" y="32" fill="#00F0FF" font-family="'Courier New', monospace" font-size="14" font-weight="bold">
    &gt; GitHub Contribution Snake Animation // Auto-generated by GitHub Actions
  </text>

  <!-- Sample Grid Pattern (Dark Mode) -->
  <g transform="translate(30, 45)">
    <!-- Column 1 -->
    <rect x="0" y="0" width="11" height="11" rx="2" fill="#161B22"/>
    <rect x="0" y="14" width="11" height="11" rx="2" fill="#161B22"/>
    <rect x="0" y="28" width="11" height="11" rx="2" fill="#0e4429"/>
    <rect x="0" y="42" width="11" height="11" rx="2" fill="#161B22"/>
    <rect x="0" y="56" width="11" height="11" rx="2" fill="#006d32"/>
    <rect x="0" y="70" width="11" height="11" rx="2" fill="#161B22"/>

    <!-- Column 2 -->
    <rect x="15" y="0" width="11" height="11" rx="2" fill="#161B22"/>
    <rect x="15" y="14" width="11" height="11" rx="2" fill="#006d32"/>
    <rect x="15" y="28" width="11" height="11" rx="2" fill="#26a641"/>
    <rect x="15" y="42" width="11" height="11" rx="2" fill="#161B22"/>
    <rect x="15" y="56" width="11" height="11" rx="2" fill="#39d353"/>
    <rect x="15" y="70" width="11" height="11" rx="2" fill="#26a641"/>

    <!-- Column 3 -->
    <rect x="30" y="0" width="11" height="11" rx="2" fill="#0e4429"/>
    <rect x="30" y="14" width="11" height="11" rx="2" fill="#26a641"/>
    <rect x="30" y="28" width="11" height="11" rx="2" fill="#39d353"/>
    <rect x="30" y="42" width="11" height="11" rx="2" fill="#26a641"/>
    <rect x="30" y="56" width="11" height="11" rx="2" fill="#006d32"/>
    <rect x="30" y="70" width="11" height="11" rx="2" fill="#161B22"/>

    <!-- Snake Body -->
    <path d="M 60 19 H 120 V 47 H 180 V 75 H 240" stroke="url(#cyberSnake)" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)">
      <animate attributeName="stroke-dashoffset" values="500;0" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- Snake Head -->
    <circle cx="240" cy="75" r="5" fill="#00F0FF" filter="url(#neonGlow)">
      <animate attributeName="r" values="5;6.5;5" dur="1s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Footer Tagline -->
  <text x="30" y="138" fill="#64748B" font-family="'Courier New', monospace" font-size="11">
    [ SYSTEM READY // WORKFLOW SCHEDULED DAILY AT 00:00 UTC ]
  </text>
</svg>
